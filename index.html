<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>OUTLAW — مكتب الشيرف</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@500;700&family=Noto+Naskh+Arabic:wght@400;700&family=Rye&family=Special+Elite&display=swap" rel="stylesheet">
<style>/* ground: navy + brass. Every surface (cards, tables, forms) stays in the navy family. */
:root{
  --navy:#0b141c;--navy2:#111e29;--navy3:#18293a;
  --brass:#c4a452;--brass-l:#e0c880;--brass-d:#8a6f2c;
  --paper:#e3e5df;--seal:#8c2b22;--seal-l:#a53a2f;
  --line:rgba(196,164,82,.2);--mute:#93a0aa;--ok:#2f6b4a;
  --star:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);
  --f-head:'Reem Kufi','Noto Naskh Arabic',serif;--f-body:'Noto Naskh Arabic','Amiri',Georgia,serif;
  --f-mark:'Rye',Georgia,serif;--f-mono:'Special Elite','Courier New',monospace;
  --gx:max(16px,env(safe-area-inset-left,0px));--gx2:max(16px,env(safe-area-inset-right,0px));
  color-scheme:dark
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{direction:rtl;scroll-behavior:smooth}
body{margin:0;min-height:100vh;direction:rtl;text-align:start;color:var(--paper);font-family:var(--f-body);
  background:repeating-linear-gradient(135deg,rgba(255,255,255,.018) 0 2px,transparent 2px 7px),radial-gradient(ellipse at 50% 0%,#1d3246 0%,var(--navy) 70%) fixed,var(--navy)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--navy);z-index:30}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font-family:inherit;font-size:1rem}
:focus-visible{outline:2px solid var(--brass-l);outline-offset:2px}
h1,h2,h3,h4{font-family:var(--f-head);margin:0;text-wrap:balance}
p{margin:0}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--navy);border-bottom:1px solid var(--brass-d)}
.top-in{max-width:1120px;margin:0 auto;padding:8px var(--gx2) 0 var(--gx);display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-mark);color:var(--brass);letter-spacing:.12em;font-size:1.15rem;padding-bottom:8px}
.brand img{width:36px;height:36px}
.nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.nav::-webkit-scrollbar{display:none}
.nav a{flex:none;padding:12px 14px;font-family:var(--f-head);font-weight:700;color:var(--mute);border-bottom:3px solid transparent;white-space:nowrap}
.nav a:hover{color:var(--paper)}
.nav a[aria-current=page]{color:var(--brass-l);border-bottom-color:var(--brass)}
.mode{padding-bottom:8px}
.demo{display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap;background:var(--seal);color:#f3efe3;font-size:.9rem;padding:4px var(--gx2) 4px var(--gx)}
.demo button{background:rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:2px;padding:0 10px;cursor:pointer;font-size:.85rem}

/* layout */
.wrap{max-width:1120px;margin:0 auto;padding:28px var(--gx2) 56px var(--gx)}
.pagehead{display:flex;align-items:center;gap:18px;margin-bottom:24px}
.pagehead>div:last-child{min-width:0}
.star{flex:none;width:72px;height:72px;display:grid;place-items:center;padding-top:6px;clip-path:var(--star);background:linear-gradient(180deg,var(--brass-l),var(--brass) 55%,var(--brass-d));color:var(--navy);font-family:var(--f-mark);font-size:.95rem;direction:ltr}
.pagehead h1{font-size:clamp(1.8rem,5vw,2.6rem);line-height:1.3;color:var(--brass-l)}
.pagehead p{color:var(--mute);font-size:1.1rem;line-height:1.8;max-width:60ch}
.sheet{background:linear-gradient(180deg,var(--navy2),#0e1923);color:var(--paper);border:1px solid var(--brass-d);border-radius:3px;box-shadow:0 18px 44px rgba(0,0,0,.5),0 0 0 3px var(--navy),0 0 0 4px rgba(138,111,44,.6);padding:22px 20px 26px;min-width:0}
.sheet+.sheet,.sheet+section,section+.sheet{margin-top:30px}
.sh{display:flex;align-items:baseline;flex-wrap:wrap;gap:6px 12px;margin:0 0 6px;padding-bottom:10px;border-bottom:4px double var(--brass-d)}
.sh h2{font-size:1.5rem;color:var(--brass-l);line-height:1.5}
.sh span{font-family:var(--f-mono);color:var(--brass-d);direction:ltr;font-size:.9rem}
.sh .btn{margin-inline-start:auto}
.lead{font-size:1.1rem;line-height:2;color:var(--paper);margin:10px 0 16px;max-width:70ch}
.tag{display:inline-block;font-family:var(--f-mono);font-size:.82rem;line-height:1.7;padding:0 .5rem;border-radius:2px;background:var(--seal);color:#f3efe3;direction:ltr;white-space:nowrap}
.tag.brass{background:var(--brass);color:var(--navy)}
.tag.ok{background:var(--ok);color:#eef5ef}
.tag.dim{background:#4a5762}

/* controls */
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
input,select,textarea{background:var(--navy);color:var(--paper);border:1px solid var(--brass-d);border-radius:3px;padding:9px 12px;min-width:0}
input::placeholder,textarea::placeholder{color:var(--mute)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brass-l);box-shadow:0 0 0 2px rgba(224,200,128,.25)}
.bar input[type=search],.bar select{flex:1 1 200px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:6px 14px;border:1px solid var(--brass-d);background:transparent;color:var(--paper);border-radius:2px;cursor:pointer;font-family:var(--f-head);font-weight:700}
.chip:hover{background:rgba(196,164,82,.16)}
.chip[aria-pressed=true]{background:var(--brass);color:var(--navy);border-color:var(--brass)}
.count{color:var(--mute);font-size:.95rem;margin:12px 0 8px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 16px;border:1px solid var(--brass);background:var(--brass);color:var(--navy);border-radius:2px;cursor:pointer;font-family:var(--f-head);font-weight:700}
.btn:hover{background:var(--brass-l)}
.btn.ghost{background:transparent;color:var(--brass-l);border-color:var(--brass-d)}
.btn.ghost:hover{background:rgba(196,164,82,.16)}
.btn.danger{background:transparent;color:#e8a49c;border-color:var(--seal-l)}
.btn.danger:hover,.btn.danger.sure{background:var(--seal);color:#fff}
.btn.sm{padding:2px 12px;font-size:.92rem}
.btn:disabled{opacity:.5;cursor:default}

/* tables */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:2px}
table{width:100%;border-collapse:collapse;font-size:1.05rem}
th,td{padding:9px 12px;text-align:start;border-bottom:1px solid var(--line);vertical-align:top;line-height:1.7}
th{background:var(--navy3);color:var(--brass-l);font-family:var(--f-head);white-space:nowrap}
tbody tr:nth-child(even){background:rgba(255,255,255,.03)}
td.num,.ltr{direction:ltr;text-align:left;font-family:var(--f-mono)}
.rk{display:inline-flex;align-items:center;gap:8px;font-family:var(--f-head);font-weight:700;color:var(--brass-l);white-space:nowrap}
.rk i{width:14px;height:14px;background:var(--brass);clip-path:var(--star);flex:none}
.st{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.st::before{content:"";width:9px;height:9px;border-radius:50%;background:#4aa275}
.st.leave::before{background:var(--brass)}.st.suspended::before{background:var(--seal-l)}
.empty{padding:28px 10px;text-align:center;color:var(--mute)}

/* home */
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;padding:34px 16px 30px;border:1px solid var(--brass-d);outline:1px solid var(--brass);outline-offset:-12px;border-radius:3px;
  background:radial-gradient(circle at 50% 30%,rgba(196,164,82,.22),transparent 58%),linear-gradient(180deg,var(--navy3),var(--navy));box-shadow:0 24px 60px rgba(0,0,0,.6),0 0 0 4px var(--navy3),0 0 0 5px var(--brass-d)}
.hero img{width:clamp(120px,22vw,190px);height:auto;filter:drop-shadow(0 14px 20px rgba(0,0,0,.7));margin-bottom:12px}
.hero h1{font-family:var(--f-mark);font-weight:400;font-size:clamp(2.4rem,9vw,4rem);letter-spacing:.12em;padding-inline-start:.12em;line-height:1.2;background:linear-gradient(180deg,#f0dca0 0%,#c4a452 52%,#8a6f2c 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.orn{display:flex;align-items:center;gap:12px;width:min(70%,360px);margin:10px 0}
.orn::before,.orn::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--brass))}
.orn::after{transform:scaleX(-1)}
.orn i{width:14px;height:14px;background:var(--brass);clip-path:var(--star)}
.hero .sub{font-family:var(--f-head);font-weight:700;font-size:clamp(1.4rem,4vw,2rem)}
.hero .en{font-family:var(--f-mono);color:var(--brass);direction:ltr;margin-top:4px}
.stats{display:flex;flex-wrap:wrap;justify-content:center;gap:10px 30px;margin-top:22px;padding-top:18px;border-top:1px solid var(--brass-d);width:min(100%,640px)}
.stats div{display:flex;flex-direction:column;align-items:center;min-width:80px}
.stats b{font-family:var(--f-mono);font-weight:400;font-size:1.9rem;color:var(--brass-l);line-height:1.2}
.stats span{color:var(--mute);font-size:.95rem}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px;margin-top:30px}
.tile{display:flex;flex-direction:column;gap:6px;padding:18px 18px 16px;background:var(--navy2);border:1px solid var(--brass-d);border-radius:3px;min-width:0}
.tile:hover{background:var(--navy3);border-color:var(--brass-l)}
.tile h3{font-size:1.3rem;color:var(--brass-l)}
.tile p{color:var(--mute);line-height:1.9}
.tile .go{margin-top:auto;padding-top:8px;font-family:var(--f-head);color:var(--brass)}
.ladder{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.ladder a{padding:3px 12px;border:1px solid var(--brass-d);color:var(--brass-l);font-family:var(--f-head);font-weight:700;border-radius:2px;background:var(--navy2)}
.ladder a:hover{background:var(--brass);color:var(--navy)}
.hl{margin:34px 0 0}.hl h2{font-size:1.25rem;color:var(--brass)}

/* ranks */
.rank{display:grid;grid-template-columns:auto 1fr;gap:6px 18px;padding:20px 0;border-top:1px dotted var(--line);scroll-margin-top:90px}
.rank:first-of-type{border-top:0;padding-top:6px}
.rank .star{width:64px;height:64px;font-size:1.1rem;padding-top:5px}
.rank .nm{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px}
.rank h3{font-size:1.5rem;color:var(--brass-l)}
.rank .en{font-family:var(--f-mono);color:var(--brass);direction:ltr}
.rank .body{grid-column:1/-1;min-width:0}
.stars{display:flex;gap:3px;margin-top:5px}
.stars i{width:13px;height:13px;background:var(--brass);clip-path:var(--star)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:6px 28px;margin-top:10px}
.cols h4{margin:8px 0 4px;font-size:1.05rem;color:var(--brass-l)}
.cols ul{list-style:none;margin:0;padding:0}
.cols li{position:relative;padding-inline-start:1.5rem;line-height:1.9;font-size:1.08rem;margin-bottom:3px}
.cols li::before{content:"";position:absolute;inset-inline-start:.1rem;top:.7em;width:.7rem;height:.7rem;background:#4aa275;clip-path:var(--star)}
.cols .no li::before{background:var(--seal-l)}
.acts{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:10px}
.lnk{color:var(--brass-l);border-bottom:2px solid var(--brass);font-family:var(--f-head);font-weight:700;cursor:pointer;background:none;border-top:0;border-inline:0;padding:0}

/* promotions */
.deg{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:14px}
.dg{border:1px solid var(--line);border-top:4px solid var(--seal);padding:12px 14px 10px;background:rgba(255,255,255,.03);min-width:0}
.dg .h{display:flex;align-items:center;gap:10px}
.dg h3{font-size:1.2rem;color:var(--brass-l)}
.dg p{line-height:1.9;margin:4px 0 6px}
.dg ul{margin:0;padding-inline-start:1.2rem}.dg li{line-height:1.8}
.dg[data-n="1"]{border-top-color:#7d8a91}.dg[data-n="2"]{border-top-color:var(--brass)}.dg[data-n="3"]{border-top-color:#c9822f}.dg[data-n="4"]{border-top-color:#c0562b}.dg[data-n="5"]{border-top-color:var(--seal-l)}.dg[data-n="6"]{border-top-color:#e0453a}
.mx td:first-child,.mx th:first-child{position:sticky;inset-inline-start:0;z-index:1}
.mx td:first-child{background:var(--navy2)}
.mx td{min-width:130px;background:color-mix(in srgb,var(--seal) calc(var(--s) * 11%),transparent)}
.mx td:first-child{background:var(--navy2)}
.mx td b{font-weight:700;color:#fff}
.mx select{width:100%;background:rgba(11,20,28,.75)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin:12px 0 0;font-size:.95rem;color:var(--mute)}
.legend span{display:inline-flex;gap:6px;align-items:center}
.legend i{width:14px;height:14px;border:1px solid var(--line);background:color-mix(in srgb,var(--seal) calc(var(--s) * 11%),var(--navy))}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr));gap:14px}
.step{border:1px solid var(--line);padding:12px 14px;background:rgba(255,255,255,.03);min-width:0}
.step .h{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.step .arrow{color:var(--brass)}
.step dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:3px 12px}
.step dt{color:var(--mute)}.step dd{margin:0;font-weight:700}

/* wings */
.wg{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,470px),1fr));gap:30px}
.wg>.sheet+.sheet{margin-top:0}
.wing h2{font-size:1.5rem;color:var(--brass-l)}
.wing .h{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline}
.wing .en{font-family:var(--f-mono);color:var(--brass);direction:ltr}
.meta{display:flex;flex-wrap:wrap;gap:6px 16px;margin:10px 0;padding:8px 0;border-block:1px dotted var(--line)}
.meta b{color:var(--brass-l)}
.wing h4{color:var(--brass-l);margin:12px 0 4px;font-size:1.05rem}
.wing ol,.wing ul{margin:0;padding-inline-start:1.4rem}.wing li{line-height:1.9;margin-bottom:2px}

/* banned */
.bn{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));gap:16px}
.item{border:1px solid var(--line);border-inline-start:6px solid var(--brass);background:rgba(255,255,255,.03);min-width:0;display:flex;flex-direction:column}
.item.illegal{border-inline-start-color:var(--seal-l)}
.item .ph{width:100%;aspect-ratio:16/10;object-fit:cover;display:block;border-bottom:1px solid var(--line);background:var(--navy)}
.item .in{padding:12px 14px;display:flex;flex-direction:column;flex:1}
.item .h{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.item h3{font-size:1.25rem;color:var(--brass-l)}
.item p{line-height:1.9;margin:4px 0}
.item h4{margin:8px 0 2px;font-size:1rem;color:var(--brass-l)}
.item ul{margin:0;padding-inline-start:1.2rem}.item li{line-height:1.8}
.item .act{margin-top:auto;padding-top:8px;border-top:1px dotted var(--line);font-weight:700;color:#e8a49c}
.item .acts{padding-top:8px}
.key{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:12px;margin:12px 0 18px}
.key div{padding:10px 12px;border:1px solid var(--line);line-height:1.8;background:rgba(255,255,255,.03)}

/* editor */
.ov{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.72);display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:max(16px,env(safe-area-inset-top,0px)) var(--gx2) 24px var(--gx)}
.dlg{width:min(640px,100%);margin:24px 0}
.dlg h2{font-size:1.4rem;color:var(--brass-l);margin-bottom:14px;padding-bottom:10px;border-bottom:4px double var(--brass-d)}
.fld{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.fld label{color:var(--brass-l);font-family:var(--f-head);font-weight:700}
.fld small{color:var(--mute)}
.fld textarea{min-height:5.5em;resize:vertical;line-height:1.8}
.fld input[type=date],.fld input[type=number]{direction:ltr;text-align:left}
.fld .pv{max-width:260px;aspect-ratio:16/10;object-fit:cover;border:1px solid var(--line)}
.foot{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px;padding-top:14px;border-top:1px dotted var(--line)}
.foot .sp{flex:1}
.err{color:#e8a49c;margin-top:8px}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--brass);color:var(--navy);padding:8px 18px;border-radius:2px;font-weight:700;z-index:60;max-width:90vw}

footer{border-top:1px solid var(--brass-d);padding:16px var(--gx2) calc(16px + env(safe-area-inset-bottom,0px)) var(--gx);text-align:center;color:var(--mute);font-size:.9rem}

@media(max-width:560px){.pagehead{align-items:flex-start}.star{width:56px;height:56px}.sheet{padding:18px 14px 22px}.rank{grid-template-columns:1fr}.rank .star{width:52px;height:52px}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}

<script>/* ربط الموقع بـ Supabase: حسابات، أدوار، بيانات، صور */
window.OUTLAW_ADAPTER=async function(){
  const C=window.OUTLAW_CONFIG||{};
  if(!C.url||!C.key||/ضع|YOUR/i.test(C.url+C.key)||!window.supabase)return null;
  const sb=window.supabase.createClient(C.url,C.key,{auth:{persistSession:true,autoRefreshToken:true}});
  const cache=new Map(),L=new Set();
  const col=c=>{if(!cache.has(c))cache.set(c,new Map());return cache.get(c)};
  const notify=c=>L.forEach(l=>{if(l.c===c)l.fire()});
  const {data,error}=await sb.from('docs').select('collection,id,data');
  if(error)return null;
  data.forEach(r=>col(r.collection).set(r.id,r.data));
  sb.channel('docs-live').on('postgres_changes',{event:'*',schema:'public',table:'docs'},p=>{
    if(p.eventType==='DELETE'){const o=p.old;col(o.collection).delete(o.id);notify(o.collection)}
    else{const n=p.new;col(n.collection).set(n.id,n.data);notify(n.collection)}
  }).subscribe();
  const snap=(c,id)=>{const m=col(c),has=m.has(id);return{id,exists:has,data:()=>has?m.get(id):undefined}};
  const fail=e=>{throw{code:'invalid_argument',message:e.message}};
  const db={
    doc(path){const i=path.indexOf('/'),c=path.slice(0,i),id=path.slice(i+1);return{
      async set(d){const {error}=await sb.from('docs').upsert({collection:c,id,data:d,updated_at:new Date().toISOString()});if(error)fail(error);col(c).set(id,d);notify(c)},
      async delete(){const {error}=await sb.from('docs').delete().eq('collection',c).eq('id',id);if(error)fail(error);col(c).delete(id);notify(c)},
      onSnapshot(next){const l={c,fire:()=>next(snap(c,id))};L.add(l);setTimeout(l.fire);return()=>L.delete(l)}}},
    collection(c){return{onSnapshot(next){const l={c,fire:()=>{const docs=[...col(c).entries()].map(([id,d])=>({id,exists:true,data:()=>d}));next({docs,size:docs.length})}};L.add(l);setTimeout(l.fire);return()=>L.delete(l)}}}
  };
  const assets={async upload(blob){
    const name=(crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random().toString(16).slice(2))+'.webp';
    const {error}=await sb.storage.from('images').upload(name,blob,{contentType:'image/webp',cacheControl:'31536000'});
    if(error)throw error;
    return{id:name,url:sb.storage.from('images').getPublicUrl(name).data.publicUrl};
  }};
  const prof=async()=>{
    const {data:s}=await sb.auth.getSession();const u=s&&s.session&&s.session.user;if(!u)return null;
    const {data:p}=await sb.from('profiles').select('*').eq('id',u.id).maybeSingle();
    return p||{id:u.id,email:u.email,name:'',role:'viewer'};
  };
  const auth={
    current:prof,
    onChange(cb){sb.auth.onAuthStateChange(()=>{setTimeout(async()=>cb(await prof()))})},
    async signIn(email,password){const {error}=await sb.auth.signInWithPassword({email,password});if(error)throw error},
    async signUp(email,password,name){const {data,error}=await sb.auth.signUp({email,password,options:{data:{name}}});if(error)throw error;return{needsConfirm:!data.session}},
    async signOut(){await sb.auth.signOut()},
    async listProfiles(){const {data,error}=await sb.from('profiles').select('*').order('created_at');if(error)throw error;return data},
    async setRole(id,role){const {error}=await sb.from('profiles').update({role}).eq('id',id);if(error)throw error}
  };
  return{db,assets,auth};
};

/* ---------- toast ---------- */
let tt;function toast(m){let t=$('.toast');if(!t){t=document.createElement('div');t.className='toast';t.setAttribute('role','status');document.body.appendChild(t)}t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,2800)}

/* ---------- db helpers ---------- */
async function save(kind,obj){
  if(!caps.db)return false;
  try{await caps.db.doc(kind+'/'+obj.id).set(obj);return true}
  catch(err){toast(err&&err.code==='invalid_argument'?'ما عندك صلاحية تعديل':'تعذر الحفظ، حاول مرة ثانية');return false}
}
async function remove(kind,id){
  if(!caps.db)return false;
  try{await caps.db.doc(kind+'/'+id).delete();return true}catch(err){toast('تعذر الحذف');return false}
}
async function ensureSeeded(){ /* لو تعدّل قبل التهيئة نثبّت النسخة الحالية أولاً */
  if(caps.seeded||!caps.db)return;
  const db=caps.db,w=[];
  S.ranks.forEach(r=>w.push(db.doc('ranks/'+r.id).set(r)));
  S.members.forEach(r=>w.push(db.doc('members/'+r.id).set(r)));
  S.degrees.forEach(r=>w.push(db.doc('degrees/'+r.id).set(r)));
  Object.values(S.promotionsMap).forEach(r=>w.push(db.doc('promotions/'+r.id).set(r)));
  S.wings.forEach(r=>w.push(db.doc('wings/'+r.id).set(r)));
  S.banned.forEach(r=>w.push(db.doc('banned/'+r.id).set(r)));
  w.push(db.doc('config/penalties').set({rows:S.penalties}));
  w.push(db.doc('config/site').set({example:showDemo()}));
  await Promise.all(w);await db.doc('config/seeded').set({v:1});caps.seeded=true;
}

/* ---------- live data ---------- */
let rq=0;const sched=()=>{cancelAnimationFrame(rq);rq=requestAnimationFrame(()=>apply())};
function apply(){
  if(!caps.seeded)return;
  const L=live;
  if(L.ranks)S.ranks=[...L.ranks].sort((a,b)=>a.id-b.id);
  if(L.members)S.members=L.members;
  if(L.degrees)S.degrees=[...L.degrees].sort((a,b)=>a.n-b.n);
  if(L.promotions)S.promotionsMap=Object.fromEntries(L.promotions.map(p=>[p.id,p]));
  if(L.wings)S.wings=[...L.wings].sort((a,b)=>(a.o||0)-(b.o||0));
  if(L.banned)S.banned=[...L.banned].sort((a,b)=>(a.o||0)-(b.o||0));
  if(L.penalties)S.penalties=L.penalties;
  render();
}
function listen(){
  const db=caps.db;if(!db)return;
  const col=(n)=>db.collection(n).onSnapshot(q=>{live[n]=q.docs.map(d=>d.data());sched()},()=>{});
  ['ranks','members','degrees','promotions','wings','banned'].forEach(col);
  db.doc('config/penalties').onSnapshot(d=>{if(d.exists)live.penalties=d.data().rows;sched()},()=>{});
  db.doc('config/site').onSnapshot(d=>{if(d.exists)live.site=d.data();sched()},()=>{});
  db.doc('config/seeded').onSnapshot(d=>{caps.seeded=d.exists;sched()},()=>{});
}

function authBox(){
  if(caps.auth){
    if(!caps.profile)return `<button class="btn sm" data-act="login">دخول</button>`;
    const nm=e(caps.profile.name||caps.profile.email||'');
    return `<span class="mode"><span class="tag ${caps.level?'ok':'dim'}">${ROLE_AR[caps.profile.role]||''}</span> <bdi>${nm}</bdi> <button class="btn ghost sm" data-act="logout">خروج</button></span>`;

  return caps.write?'<span class="mode tag ok">وضع التعديل</span>':'';
}

function render(){
  const a=document.activeElement,keep=a&&a.id&&['q','bq'].includes(a.id)?{id:a.id,s:a.selectionStart}:null;
  const y=window.scrollY;
  $('#app').innerHTML=shell(V[ui.route]());
  if(ui.scroll){const t=document.getElementById(ui.scroll);ui.scroll=null;if(t)t.scrollIntoView();else window.scrollTo(0,0)}else window.scrollTo(0,y);
  if(keep){const n=document.getElementById(keep.id);if(n){n.focus();try{n.setSelectionRange(keep.s,keep.s)}catch(_){}}}
  document.title='OUTLAW — مكتب الشيرف';
}
function go(r,opt={}){if(!V[r])r='home';const ch=r!==ui.route;ui.route=r;if('rank' in opt)ui.rRank=opt.rank;ui.scroll=opt.scroll||(ch?'__top':null);try{history.replaceState(null,'','#'+r)}catch(_){try{location.hash=r}catch(__){}}render();if(ui.scroll==='__top'){window.scrollTo(0,0);ui.scroll=null}}

function resizeImg(file){return new Promise((res,rej)=>{const url=URL.createObjectURL(file),im=new Image();im.onload=()=>{const m=1000,k=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(url);c.toBlob(b=>b?res(b):rej(new Error('x')),'image/webp',.85)};im.onerror=()=>rej(new Error('x'));im.src=url})}

async function loadProfiles(){try{window.__profiles=await caps.auth.listProfiles()}catch(_){window.__profiles=[]}if(ui.route==='accounts')render()}
function loginDialog(){
  const ov=document.createElement('div');ov.className='ov';let mode='in';
  const draw=()=>{ov.innerHTML=`<form class="sheet dlg" novalidate><h2>${mode==='in'?'تسجيل الدخول':'إنشاء حساب'}</h2>${mode==='up'?'<div class="fld"><label for="a_n">الاسم</label><input id="a_n" type="text" autocomplete="name"></div>':''}<div class="fld"><label for="a_e">البريد الإلكتروني</label><input id="a_e" type="email" dir="ltr" autocomplete="email"></div><div class="fld"><label for="a_p">كلمة المرور</label><input id="a_p" type="password" dir="ltr" autocomplete="${mode==='in'?'current-password':'new-password'}"><small>${mode==='up'?'6 أحرف على الأقل. الحساب الجديد يبدأ كمشاهد، والمدير يرفع صلاحيته.':''}</small></div><div class="err" id="er" hidden></div><div class="foot"><button class="btn" type="submit">${mode==='in'?'دخول':'إنشاء الحساب'}</button><button class="btn ghost" type="button" id="cn">إلغاء</button><span class="sp"></span><button class="lnk" type="button" id="sw">${mode==='in'?'ما عندي حساب':'عندي حساب'}</button></div></form>`;
    $('#cn',ov).onclick=()=>ov.remove();$('#sw',ov).onclick=()=>{mode=mode==='in'?'up':'in';draw()};
    $('form',ov).onsubmit=async ev=>{ev.preventDefault();const er=$('#er',ov);er.hidden=true;
      try{const em=$('#a_e',ov).value.trim(),pw=$('#a_p',ov).value;
        if(mode==='in')await caps.auth.signIn(em,pw);else{const r=await caps.auth.signUp(em,pw,$('#a_n',ov).value.trim());if(r&&r.needsConfirm){er.textContent='وصلك بريد لتأكيد الحساب، افتحه ثم سجّل الدخول.';er.hidden=false;return}}
        ov.remove();toast(mode==='in'?'أهلاً بك':'تم إنشاء الحساب')}
      catch(err){er.textContent=err&&err.message&&/Invalid login/i.test(err.message)?'البريد أو كلمة المرور غير صحيحة':(err&&err.message)||'تعذر الدخول';er.hidden=false}};
    const f=ov.querySelector('input');if(f)f.focus()};
  draw();document.body.appendChild(ov)
}
function openEditor(kind,id){
  const sc=SCH[kind],isNew=!id;
  let item=isNew?{}:clone(listOf(kind).find(x=>String(x.id)===String(id))||{});
  if(!isNew&&!item.id)return;
  if(kind==='promotions'&&!item.id)item={id:String(id)};
  let img=item.img||null;
  const ov=document.createElement('div');ov.className='ov';
  const fld=([k,l,t,o])=>{
    const v=item[k];const id='f_'+k;let c='';
    if(t==='text')c=`<input id="${id}" type="text" value="${e(v??'')}">`;
    else if(t==='date')c=`<input id="${id}" type="date" value="${e(v??new Date().toISOString().slice(0,10))}">`;
    else if(t==='num')c=`<input id="${id}" type="number" min="0" value="${e(v??0)}">`;
    else if(t==='area')c=`<textarea id="${id}">${e(v??'')}</textarea>`;
    else if(t==='lines')c=`<textarea id="${id}">${e((v||[]).join('\n'))}</textarea><small>كل سطر بند مستقل</small>`;
    else if(t==='rank')c=`<select id="${id}">${ranksDesc().map(r=>`<option value="${r.id}"${+v===r.id?' selected':''}>${e(r.name)}</option>`).join('')}</select>`;
    else if(t==='sel'){const cur=k==='open'?(v===false?'0':'1'):v;c=`<select id="${id}">${o().map(([a,b])=>`<option value="${e(a)}"${String(cur)===String(a)?' selected':''}>${e(b)}</option>`).join('')}</select>`}
    else if(t==='img')c=caps.assets?`<div id="pvbox"></div><input id="${id}" type="file" accept="image/*"><small id="imst">اختر صورة (تُصغَّر تلقائياً قبل الرفع)</small>`:`<small>رفع الصور غير متاح لحسابك</small>`;
    return `<div class="fld"><label for="${id}">${l}</label>${c}</div>`;
  };
  ov.innerHTML=`<form class="sheet dlg" novalidate><h2>${isNew?'إضافة':'تعديل'} ${sc.t}${kind==='promotions'?' · '+e(rank(item.id).name):''}</h2>${sc.f.map(fld).join('')}<div class="err" id="er" hidden></div><div class="foot"><button class="btn" type="submit" id="sv">حفظ</button><button class="btn ghost" type="button" id="cn">إلغاء</button><span class="sp"></span>${!isNew&&CANDEL[kind]?'<button class="btn danger" type="button" id="dl">حذف</button>':''}</div></form>`;
  document.body.appendChild(ov);
  const close=()=>ov.remove();
  const pv=()=>{const b=$('#pvbox',ov);if(b)b.innerHTML=img&&img.url?`<img class="pv" src="${e(img.url)}" alt=""> <button type="button" class="btn danger sm" id="rmi">إزالة الصورة</button>`:''; const r=$('#rmi',ov);if(r)r.onclick=()=>{img=null;pv()}};pv();
  const fi=$('#f_img',ov);
  if(fi)fi.onchange=async()=>{const f=fi.files[0];if(!f)return;const st=$('#imst',ov);st.textContent='جاري الرفع...';try{const b=await resizeImg(f);const r=await caps.assets.upload(b);img={id:r.id,url:r.url};st.textContent='تم الرفع';pv()}catch(err){st.textContent='تعذر رفع الصورة'}};
  ov.addEventListener('mousedown',ev=>{if(ev.target===ov)close()});
  $('#cn',ov).onclick=close;
  const dl=$('#dl',ov);if(dl)dl.onclick=async()=>{if(!dl.classList.contains('sure')){dl.classList.add('sure');dl.textContent='تأكيد الحذف';return}await ensureSeeded();if(await remove(kind,item.id)){close();toast('تم الحذف')}};
  $('form',ov).onsubmit=async ev=>{
    ev.preventDefault();const er=$('#er',ov);er.hidden=true;
    const out={...item};
    for(const [k,,t] of sc.f){const el=$('#f_'+k,ov);if(t==='img'){if(img)out.img=img;else delete out.img;continue}if(!el)continue;let v=el.value;
      if(t==='num'||t==='rank')v=+v;else if(t==='lines')v=v.split('\n').map(s=>s.trim()).filter(Boolean);else if(t==='text'||t==='area')v=v.trim();
      if(k==='open')v=v==='1';
      out[k]=v}
    const need=kind==='members'?'name':kind==='wings'?'ar':kind==='banned'?'name':kind==='ranks'||kind==='degrees'?'name':null;
    if(need&&!out[need]){er.textContent='الاسم مطلوب';er.hidden=false;return}
    if(isNew){
      if(kind==='ranks'){out.id=Math.max(0,...S.ranks.map(r=>r.id))+1}
      else if(kind==='members')out.id='m'+Date.now().toString(36);
      else if(kind==='wings'){out.id='w'+Date.now().toString(36);out.o=Date.now()}
      else if(kind==='banned'){out.id='b'+Date.now().toString(36);out.o=Date.now()}
    }
    $('#sv',ov).disabled=true;
    await ensureSeeded();
    let ok=await save(kind,out);
    if(ok&&isNew&&kind==='ranks'){ /* رتبة جديدة: تأخذ محاسبة الرتبة التي تحتها ومتطلبات الترقية إليها */
      const below=ranksDesc()[0];
      const rows={...S.penalties};rows[out.id]=[...(rows[below.id]||[0,1,3,4,5,7])];
      await caps.db.doc('config/penalties').set({rows});
      const pm=S.promotionsMap[below.id-1]||S.promotionsMap[below.id];
      if(!S.promotionsMap[below.id])await save('promotions',{...(pm||{hours:0,clean:0,maxDeg:'-',exam:'-',rec:'-',extra:'-'}),id:String(below.id)});
    }
    if(ok){close();toast('تم الحفظ')}else $('#sv',ov).disabled=false;
  };
  const first=ov.querySelector('input,textarea,select');if(first)first.focus();
}

/* ---------- events ---------- */
document.addEventListener('click',async ev=>{
  const t=ev.target.closest('[data-go],[data-ed],[data-rs],[data-bt],[data-act]');if(!t)return;
  if(t.dataset.go){ev.preventDefault();go(t.dataset.go,{rank:t.dataset.rank!==undefined?+t.dataset.rank:undefined,scroll:t.dataset.scroll});return}
  if(t.dataset.ed!==undefined){openEditor(t.dataset.ed,t.dataset.id);return}
  if(t.dataset.rs){ui.rStatus=t.dataset.rs;render();return}
  if(t.dataset.bt){ui.bType=t.dataset.bt;render();return}
  if(t.dataset.act==='login'){loginDialog();return}
  if(t.dataset.act==='logout'){await caps.auth.signOut();return}
  if(t.dataset.act==='hidedemo'){await ensureSeeded();try{await caps.db.doc('config/site').set({example:false});toast('تم إخفاء الشريط')}catch(_){toast('تعذر الحفظ')}}
});
document.addEventListener('input',ev=>{
  if(ev.target.id==='q'){ui.rQ=ev.target.value;render()}
  if(ev.target.id==='bq'){ui.bQ=ev.target.value;render()}
});
document.addEventListener('change',async ev=>{
  const t=ev.target;
  if(t.dataset&&t.dataset.role){try{await caps.auth.setRole(t.dataset.role_id||t.dataset.role,t.value);toast('تم تغيير الدور');await loadProfiles()}catch(_){toast('تعذر تغيير الدور')}return}
  if(t.id==='rk'){ui.rRank=+t.value;render()}
  if(t.dataset&&t.dataset.pen){
    const [r,i]=t.dataset.pen.split(':').map(Number);await ensureSeeded();
    const rows=clone(S.penalties);rows[r]=[...(rows[r]||[0,0,0,0,0,0])];rows[r][i]=+t.value;
    try{await caps.db.doc('config/penalties').set({rows});S.penalties=rows;toast('تم الحفظ');render()}catch(_){toast('ما عندك صلاحية تعديل')}
  }
});
window.addEventListener('hashchange',()=>{const r=location.hash.slice(1);if(V[r]&&r!==ui.route){ui.route=r;ui.scroll='__top';render();window.scrollTo(0,0);ui.scroll=null}});

/* ---------- boot ---------- */
(function(){const r=location.hash.slice(1);if(V[r])ui.route=r})();
render();
(async function(){
  /* وضع الاستضافة الخارجية: حسابات حقيقية عبر Supabase */
  if(window.OUTLAW_ADAPTER){
    try{
      const ad=await window.OUTLAW_ADAPTER();
      if(!ad)return;
      caps.db=ad.db;caps.auth=ad.auth;
      const setP=p=>{caps.profile=p;caps.level=p?(LEVEL[p.role]||0):0;caps.write=caps.level>=1;caps.assets=caps.level>=1?ad.assets:null;if(caps.level>=3)loadProfiles();render()};
      ad.auth.onChange(setP);listen();
      setP(await ad.auth.current());
    }catch(_){}
    return;
  }
  if(!window.claude||!window.claude.use)return;
  try{
    const [db,user,assets]=await Promise.all([claude.use('db'),claude.use('user'),claude.use('assets')]);
    caps.db=db;caps.user=user;caps.assets=assets;
    if(user){caps.owner=await user.isOwner();const c=await user.can('data.write');caps.write=!!db&&c!==false;caps.level=caps.write?2:0}
    listen();render();
  }catch(_){}
})();
})();
</script>
</body></html>
